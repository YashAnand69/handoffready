name: Verify local workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-backend.lock
      - run: npm ci --prefix frontend
      - run: python -m pip install ruff==0.17.0
      - run: ruff check --select F,E9 backend scripts tests
      - run: PYTHONPATH=backend python -m pytest -q
      - run: npm test --prefix frontend
      - run: npm run format:check --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend
# Workflow tests explicitly use model doubles. Actual model evaluation is a
# separately recorded local gate; CI never claims downloaded-model inference.
